<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Editar mundo')}"></head>
<body>
<header th:replace="~{fragments/nav :: nav(activo='mundos')}"></header>

<main class="page">
<header class="page-header">
  <div>
    <h1 class="page-title">Editar mundo</h1>
    <p class="page-sub" th:text="${mundo.nombre}">Nombre</p>
  </div>
  <div class="actions">
    <a class="btn btn-secondary" th:href="@{/mundos/{id}(id=${mundo.id})}">Volver</a>
  </div>
</header>

<div class="card">
  <p class="alert-error" th:if="${error}" th:text="${error}" role="alert"></p>
  <form method="post" th:action="@{/mundos/{id}/update(id=${mundo.id})}" class="stack">
    <div class="form-grid">
      <div class="field">
        <label for="edit-mundo-nombre">Nombre</label>
        <input id="edit-mundo-nombre" name="nombre" th:value="${mundo.nombre}" required>
      </div>
      <div class="field">
        <label for="edit-mundo-version">Versión</label>
        <input id="edit-mundo-version" name="version" th:value="${mundo.version}" required>
      </div>
      <div class="field">
        <label for="edit-mundo-modo">Modo de juego</label>
        <select id="edit-mundo-modo" name="modoJuego">
          <option th:each="modo : ${modos}" th:value="${modo}" th:text="${modo}"
                  th:selected="${modo.name() == mundo.modoJuego}"></option>
        </select>
      </div>
      <div class="field">
        <label for="edit-mundo-semilla">Semilla (opcional)</label>
        <input id="edit-mundo-semilla" name="semilla" th:value="${mundo.semilla}">
      </div>
    </div>
    <div class="actions">
      <a class="btn btn-secondary" th:href="@{/mundos/{id}(id=${mundo.id})}">Cancelar</a>
      <button type="submit" class="btn btn-primary">Guardar</button>
    </div>
  </form>
</div>
</main>
<div th:replace="~{fragments/toast :: toast}"></div>
</body>
</html>
