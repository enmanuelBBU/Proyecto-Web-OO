<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Calculadora Nether')}"></head>
<body>
<header th:replace="~{fragments/nav :: nav(activo='nether')}"></header>

<main class="page">
<header class="page-header">
  <div>
    <h1 class="page-title">Calculadora Nether</h1>
    <p class="page-sub">Convierte coordenadas entre el Overworld y el Nether para ubicar tus portales. No se guarda nada.</p>
  </div>
  <div class="actions">
    <a class="btn btn-ghost" href="/mundos">Mis mundos y portales</a>
  </div>
</header>

<div class="card">
  <h2 class="section-title">Convertir coordenadas</h2>
  <div th:replace="~{fragments/nether :: calculadora(@{/calculadora-nether})}"></div>
</div>
</main>
<div th:replace="~{fragments/toast :: toast}"></div>
</body>
</html>
