<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Materiales')}"></head>
<body>
<header th:replace="~{fragments/nav :: nav(activo='materiales')}"></header>

<main class="page">
<header class="page-header">
  <div>
    <h1 class="page-title">Materiales</h1>
    <p class="page-sub">Materias primas del catálogo.</p>
  </div>
</header>

<div class="card">
<form method="get" action="/materiales" class="toolbar">
  <div class="toolbar-grow">
    <input type="text" name="q" th:value="${q}" placeholder="Buscar por nombre o categoría" aria-label="Buscar material">
  </div>
  <button class="btn btn-secondary" type="submit">Buscar</button>
</form>
</div>

<div class="table-wrap">
<table>
  <thead><tr><th>Ícono</th><th>Nombre</th><th>Categoría</th><th>Acciones</th></tr></thead>
  <tbody>
  <tr th:each="i : ${materiales}">
    <td>
      <img th:if="${i.fullId}" th:src="${'https://blocksitems.com/api/v1/items/' + i.fullId + '/icon?size=32'}"
           width="32" height="32" alt="" onerror="this.style.display='none'">
    </td>
    <td th:text="${i.nombre}"></td>
    <td><span class="badge badge-pendiente" th:text="${i.categoria}"></span></td>
    <td th:if="${isAdmin}">
      <a th:href="@{/items/{id}/edit(id=${i.id})}">Editar</a>
    </td>
    <td th:unless="${isAdmin}"></td>
  </tr>
  </tbody>
</table>
</div>
</main>
<div th:replace="~{fragments/toast :: toast}"></div>
</body>
</html>
