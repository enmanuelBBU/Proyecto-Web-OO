<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Editar item')}"></head>
<body>
<header th:replace="~{fragments/nav :: nav(activo='items')}"></header>

<main class="page">
<header class="page-header">
  <div>
    <h1 class="page-title">Editar item</h1>
    <p class="page-sub">Datos, icono y receta del ítem.</p>
  </div>
  <div class="actions">
    <a class="btn btn-secondary" href="/items">Volver</a>
  </div>
</header>

<div class="card">
<p class="alert-error" th:if="${error}" th:text="${error}" role="alert"></p>
<form method="post" th:action="@{/items/{id}/update(id=${item.id})}" class="stack">
  <div class="field">
    <label for="editar-nombre">Nombre</label>
    <input id="editar-nombre" name="nombre" th:value="${item.nombre}" required>
  </div>
  <div class="field">
    <label for="editar-categoria">Categoría</label>
    <div class="categoria-field row">
      <select id="editar-categoria" name="categoriaSeleccion">
        <option value="" th:selected="${categoriaSeleccion == ''}">Selecciona...</option>
        <option value="Materias Primas" th:selected="${categoriaSeleccion == 'Materias Primas'}">Materias Primas</option>
        <option value="Bloques de Construcción" th:selected="${categoriaSeleccion == 'Bloques de Construcción'}">Bloques de Construcción</option>
        <option value="Utilidad" th:selected="${categoriaSeleccion == 'Utilidad'}">Utilidad</option>
        <option value="Herramientas" th:selected="${categoriaSeleccion == 'Herramientas'}">Herramientas</option>
        <option value="otra" th:selected="${categoriaSeleccion == 'otra'}">Otra...</option>
      </select>
      <input name="categoriaOtra" th:value="${categoriaOtra}" placeholder="Nombre de la categoría nueva" aria-label="Nombre de la categoría nueva"
             th:style="${categoriaSeleccion == 'otra'} ? 'display:inline-block' : ''">
    </div>
  </div>
  <label class="check-label"><input type="checkbox" name="esMateriaPrima" value="true" th:checked="${item.esMateriaPrima}"> Es materia prima</label>
  <div class="field">
    <label for="editar-tipo">Tipo visual</label>
    <select id="editar-tipo" name="tipoVisual">
      <option value="" th:selected="${item.tipoVisual == null or item.tipoVisual == ''}">Automático</option>
      <option value="BLOQUE" th:selected="${item.tipoVisual == 'BLOQUE'}">Bloque (cubo)</option>
      <option value="ITEM_PLANO" th:selected="${item.tipoVisual == 'ITEM_PLANO'}">Ítem plano</option>
    </select>
  </div>
  <div class="field">
    <label for="editar-textura">Buscar textura / Palabra clave</label>
    <div class="icon-search-row">
      <input id="editar-textura" type="text" placeholder="ej. espada, pico, madera, tierra" autocomplete="off">
      <button type="button" class="btn btn-secondary icon-buscar-btn" data-buscar="editar-textura" data-fullid="editar-fullId" data-target="editar-sugerencias">Sugerir icono</button>
    </div>
    <div class="icon-suggestions" id="editar-sugerencias"></div>
  </div>
  <div class="field">
    <label for="editar-fullId">Full ID (Minecraft)</label>
    <div class="icon-preview-row">
      <div class="icon-preview" id="editar-preview">
        <img class="icon-preview-img" alt="" hidden>
        <span class="icon-preview-text">Sin icono</span>
      </div>
      <input id="editar-fullId" name="fullId" th:value="${item.fullId}" data-preview="editar-preview" placeholder="minecraft:diamond_sword" required>
    </div>
  </div>
  <div class="field">
    <label for="editar-tipo-receta">Tipo de receta</label>
    <select id="editar-tipo-receta" name="tipoReceta" class="recipe-type-select">
      <option value="CRAFTEO" th:selected="${tipoReceta != 'HORNO'}">Mesa de crafteo</option>
      <option value="HORNO" th:selected="${tipoReceta == 'HORNO'}">Horno (fundición)</option>
    </select>
  </div>
  <div>
    <span class="recipe-grid-hint">Receta (grilla 3x3 — arrastra un item desde la lista):</span>
    <span class="furnace-hint" hidden>Ítem de entrada del horno (arrastra un item desde la lista):</span>
    <div class="recipe-editor">
      <div class="recipe-grid">
        <div class="recipe-slot" th:each="valor : ${recetaMatriz}">
          <button type="button" class="recipe-slot-remove" title="Quitar" aria-label="Quitar item de la casilla">×</button>
          <img class="recipe-slot-icon" alt="">
          <span class="recipe-slot-name"></span>
          <input type="hidden" name="slot" th:value="${valor} ?: ''">
        </div>
      </div>
      <div class="furnace-slot" hidden>
        <div class="recipe-slot">
          <button type="button" class="recipe-slot-remove" title="Quitar" aria-label="Quitar item de la casilla">×</button>
          <img class="recipe-slot-icon" alt="">
          <span class="recipe-slot-name"></span>
          <input type="hidden" name="entradaHorno" th:value="${entradaHorno} ?: ''">
        </div>
        <span class="furnace-arrow" aria-hidden="true">🔥 →</span>
      </div>
      <div class="recipe-item-list"><p class="recipe-item-list-hint">Cargando items...</p></div>
    </div>
  </div>
  <div class="actions">
    <a class="btn btn-secondary" href="/items">Cancelar</a>
    <button type="submit" class="btn btn-primary">Guardar</button>
  </div>
</form>
</div>
</main>

<script src="/item-icon-suggest.js"></script>
<script src="/category-select.js"></script>
<script src="/recipe-item-list.js"></script>
<script src="/recipe-type.js"></script>
<div th:replace="~{fragments/toast :: toast}"></div>
</body>
</html>
