<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Campos de mundo + coordenadas para los formularios de proyecto. p puede ser null (crear). -->
<div th:fragment="campos(p)" class="field">
  <label for="proyecto-mundo">Mundo (opcional)</label>
  <select id="proyecto-mundo" name="mundoId">
    <option value="">Sin mundo</option>
    <option th:each="mu : ${mundos}" th:value="${mu.id}"
            th:text="${mu.nombre + ' (' + mu.version + ')'}"
            th:selected="${p != null and mu.id == p.mundoId}"></option>
  </select>
  <p th:if="${#lists.isEmpty(mundos)}" class="field-hint muted">
    No hay mundos registrados. <a href="/mundos">Registra uno</a> para ubicar el proyecto.
  </p>
  <div class="coord-row">
    <label>X <input type="number" name="x" min="-30000000" max="30000000" th:value="${p != null ? p.x : ''}"></label>
    <label>Y <input type="number" name="y" min="-64" max="320" th:value="${p != null ? p.y : ''}"></label>
    <label>Z <input type="number" name="z" min="-30000000" max="30000000" th:value="${p != null ? p.z : ''}"></label>
  </div>
</div>
</body>
</html>
