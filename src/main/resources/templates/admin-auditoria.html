<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Auditoría')}"></head>
<body>
<header th:replace="~{fragments/nav :: nav(activo='admin-auditoria')}"></header>

<main class="page">
<header class="page-header">
  <div>
    <h1 class="page-title">Log de auditoría</h1>
    <p class="page-sub">Eventos de creación, edición y eliminación.</p>
  </div>
</header>

<div class="card">
  <h2 class="section-title">Filtrar eventos</h2>
  <form method="get" action="/admin/auditoria" class="toolbar">
    <div class="field">
      <label for="aud-entidad">Entidad</label>
      <select id="aud-entidad" name="entidad">
        <option value="">Todas</option>
        <option th:each="en : ${entidades}" th:value="${en}" th:text="${en}" th:selected="${en == entidad}"></option>
      </select>
    </div>
    <div class="field">
      <label for="aud-accion">Acción</label>
      <select id="aud-accion" name="accion">
        <option value="">Todas</option>
        <option th:each="ac : ${acciones}" th:value="${ac}" th:text="${ac}" th:selected="${ac == accion}"></option>
      </select>
    </div>
    <div class="field toolbar-grow">
      <label for="aud-q">Buscar</label>
      <input id="aud-q" name="q" th:value="${q}" placeholder="Usuario, nombre o id">
    </div>
    <button class="btn btn-secondary" type="submit">Filtrar</button>
    <a class="btn btn-ghost" href="/admin/auditoria">Limpiar</a>
  </form>
</div>

<div class="card empty-state" th:if="${#lists.isEmpty(eventos)}">
  <svg th:replace="~{fragments/icons :: icon('shield')}"></svg>
  <p>No hay eventos registrados con esos filtros.</p>
</div>

<div class="table-wrap" th:unless="${#lists.isEmpty(eventos)}">
<table>
  <thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Entidad</th><th>Nombre</th><th>Detalle</th></tr></thead>
  <tbody>
  <tr th:each="e : ${eventos}">
    <td class="mono" th:text="${e.fecha != null and e.fecha.length() >= 16 ? #strings.replace(#strings.substring(e.fecha, 0, 16), 'T', ' ') : e.fecha}"></td>
    <td th:text="${e.actorNombre != null ? e.actorNombre : e.actorUid}"></td>
    <td>
      <span th:class="${e.accion == 'ELIMINAR'} ? 'badge badge-cancelado' : (${e.accion == 'CREAR'} ? 'badge badge-completado' : 'badge badge-pendiente')"
            th:text="${e.accion}"></span>
    </td>
    <td class="mono" th:text="${e.entidad}"></td>
    <td>
      <span th:text="${e.entidadNombre}"></span>
      <div class="mono id-sub" th:text="${e.entidadId}"></div>
    </td>
    <td th:text="${e.detalle != null ? e.detalle : '—'}"></td>
  </tr>
  </tbody>
</table>
</div>
</main>
<div th:replace="~{fragments/toast :: toast}"></div>
</body>
</html>
