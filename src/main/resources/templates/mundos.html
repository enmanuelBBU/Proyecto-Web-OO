<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Mis mundos')}"></head>
<body>
<header th:replace="~{fragments/nav :: nav(activo='mundos')}"></header>

<main class="page">
<header class="page-header">
  <div>
    <h1 class="page-title">Mis mundos</h1>
    <p class="page-sub">Mundos o servidores donde ubicas tus proyectos.</p>
  </div>
  <div class="actions">
    <a class="btn btn-primary" href="#registrar-mundo">
      <svg th:replace="~{fragments/icons :: icon('plus')}"></svg> Registrar mundo
    </a>
  </div>
</header>

<div class="card empty-state" th:if="${#lists.isEmpty(mundos)}">
  <svg th:replace="~{fragments/icons :: icon('globe')}"></svg>
  <h2 class="section-title">Aún no registras mundos</h2>
  <p>Registra tus mundos o servidores para asignarles proyectos con coordenadas exactas.</p>
</div>

<div class="table-wrap" th:unless="${#lists.isEmpty(mundos)}">
<table>
  <thead><tr><th>Nombre</th><th>Versión</th><th>Modo</th><th>Semilla</th><th>Acciones</th></tr></thead>
  <tbody>
  <tr th:each="mu : ${mundos}">
    <td th:text="${mu.nombre}"></td>
    <td class="mono" th:text="${mu.version}"></td>
    <td><span class="badge badge-pendiente" th:text="${mu.modoJuego}"></span></td>
    <td class="mono" th:text="${mu.semilla != null ? mu.semilla : '—'}"></td>
    <td>
      <a class="btn btn-secondary btn-sm" th:href="@{/mundos/{id}(id=${mu.id})}">Ver</a>
      <a class="btn btn-ghost btn-sm" th:href="@{/mundos/{id}/edit(id=${mu.id})}">Editar</a>
    </td>
  </tr>
  </tbody>
</table>
</div>

<div class="card" id="registrar-mundo">
  <h2 class="section-title">Registrar mundo</h2>
  <p class="alert-error" th:if="${error}" th:text="${error}" role="alert"></p>
  <form method="post" action="/mundos" class="stack">
    <div class="form-grid">
      <div class="field">
        <label for="mundo-nombre">Nombre</label>
        <input id="mundo-nombre" name="nombre" required placeholder="Ej: Survival con amigos">
      </div>
      <div class="field">
        <label for="mundo-version">Versión</label>
        <input id="mundo-version" name="version" required placeholder="Ej: 1.21.4">
      </div>
      <div class="field">
        <label for="mundo-modo">Modo de juego</label>
        <select id="mundo-modo" name="modoJuego">
          <option th:each="modo : ${modos}" th:value="${modo}" th:text="${modo}"></option>
        </select>
      </div>
      <div class="field">
        <label for="mundo-semilla">Semilla (opcional)</label>
        <input id="mundo-semilla" name="semilla" placeholder="Ej: -4172144997902289642">
      </div>
    </div>
    <div class="actions">
      <button type="submit" class="btn btn-primary">Registrar</button>
    </div>
  </form>
</div>
</main>
<div th:replace="~{fragments/toast :: toast}"></div>
</body>
</html>
