<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login · SGI Minecraft</title>
<link rel="stylesheet" href="/style.css">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700&family=Karla:wght@400;700&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="auth-shell">
  <div class="auth-brand">
    <div>
      <div class="crest">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 3h12l3 5-9 13L3 8Z"/>
          <path d="M3 8h18M8 3l1.5 5L12 21l1.5-13L16 3"/>
        </svg>
        <h1>SGI Minecraft</h1>
      </div>
      <p class="tagline">Gestión de crafteo, inventario y construcción para tu servidor.</p>
    </div>
    <ul class="stock" style="flex-direction:column; gap:6px; list-style:none; padding:0; margin:0;">
      <li>Inventario de ítems en tiempo real</li>
      <li>Perfil de constructor por cuenta</li>
      <li>Búsqueda rápida de recetas y bloques</li>
    </ul>
  </div>

  <div class="auth-form-panel">
    <h2>Entrar</h2>
    <p class="sub">Accede con tu cuenta para gestionar tu inventario.</p>
    <p class="error" th:if="${error}" th:text="${error}" role="alert"></p>

    <form method="post" action="/login" id="login-form" autocomplete="on">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" id="login-submit">Entrar</button>
    </form>

    <p class="auth-switch">¿No tienes cuenta? <a href="/register">Regístrate</a></p>
  </div>
</div>

<script>
  document.getElementById('login-form').addEventListener('submit', function () {
    var btn = document.getElementById('login-submit');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" aria-hidden="true"></span>Entrando…';
  });
</script>
<div th:replace="~{fragments/toast :: toast}"></div>
</body>
</html>
