<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Perfil')}"></head>
<body>
<header th:replace="~{fragments/nav :: nav(activo='perfil')}"></header>

<main class="page">
<header class="page-header">
  <div>
    <h1 class="page-title">Perfil</h1>
    <p class="page-sub">Tus datos de constructor.</p>
  </div>
</header>

<div class="card">
<form method="post" action="/perfil" class="stack">
  <div class="form-grid">
    <div class="field">
      <label for="perfil-nombre">Nombre</label>
      <input id="perfil-nombre" name="nombre" th:value="${p.nombre}" required>
    </div>
    <div class="field">
      <label for="perfil-email">Email</label>
      <input id="perfil-email" type="email" name="email" th:value="${p.email}" required>
    </div>
  </div>
  <div class="row"><span class="muted">Rol</span> <span class="badge badge-neutral" th:text="${p.rol}"></span></div>
  <div class="actions">
    <button type="submit" class="btn btn-primary">Guardar</button>
  </div>
</form>
</div>

<div class="card">
<h2 class="section-title">Eliminar cuenta</h2>
<p class="muted">Esta acción borra tu perfil y tu cuenta de acceso de forma permanente.</p>
<form method="post" action="/perfil/eliminar" class="actions" onsubmit="return confirm('¿Eliminar tu cuenta de forma permanente? Esta acción no se puede deshacer.');">
  <button class="btn btn-danger" type="submit">Eliminar cuenta</button>
</form>
</div>
</main>
<div th:replace="~{fragments/toast :: toast}"></div>
</body>
</html>
