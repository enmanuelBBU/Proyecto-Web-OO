<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Items')}"></head>
<body>
<header th:replace="~{fragments/nav :: nav(activo='items')}"></header>

<main class="page">
<header class="page-header">
  <div>
    <h1 class="page-title">Items</h1>
    <p class="page-sub">Catálogo de ítems y recetas de crafteo.</p>
  </div>
</header>

<div class="card">
<h2 class="section-title">Buscar item</h2>
<form method="get" action="/items" class="toolbar">
  <div class="toolbar-grow">
    <input type="text" id="items-buscar-q" name="q" th:value="${q}" placeholder="Buscar por nombre o categoría" autocomplete="off" aria-label="Buscar item">
  </div>
  <label class="check-label"><input type="checkbox" id="items-buscar-materia-prima" name="esMateriaPrima" value="true" th:checked="${esMateriaPrima != null and esMateriaPrima}"> Solo materiales</label>
  <button class="btn btn-secondary" type="submit">Buscar</button>
</form>
</div>

<div class="table-wrap" id="items-resultados-tabla"
     th:style="${(q != null and !q.isEmpty()) or (esMateriaPrima != null and esMateriaPrima)} ? '' : 'display:none'">
<table>
  <thead><tr><th>Ícono</th><th>Nombre</th><th>Categoría</th><th>Materia prima</th><th>Acciones</th></tr></thead>
  <tbody id="items-resultados">
  <tr th:each="i : ${items}">
    <td>
      <img th:if="${i.fullId}" th:src="${'https://blocksitems.com/api/v1/items/' + i.fullId + '/icon?size=32'}"
           width="32" height="32" alt="" onerror="this.style.display='none'">
    </td>
    <td><span th:text="${i.nombre}"></span> <span class="badge badge-horno" th:if="${i.tipoReceta == 'HORNO'}">Horno</span></td>
    <td><span class="badge badge-pendiente" th:text="${i.categoria}"></span></td>
    <td class="mono" th:text="${i.esMateriaPrima} ? 'Sí' : 'No'"></td>
    <td th:if="${isAdmin}">
      <a th:href="@{/items/{id}/edit(id=${i.id})}">Editar</a>
      <form method="post" th:action="@{/items/{id}/delete(id=${i.id})}" class="inline-form">
        <button class="btn btn-danger">Eliminar</button>
      </form>
    </td>
    <td th:unless="${isAdmin}"></td>
  </tr>
  </tbody>
</table>
</div>

<div class="card" th:if="${isAdmin}">
<h2 class="section-title">Crear item</h2>
<p class="alert-error" th:if="${error}" th:text="${error}" role="alert"></p>
<form method="post" action="/items" class="stack">
  <div class="field">
    <label for="crear-nombre">Nombre</label>
    <input id="crear-nombre" name="nombre" required>
  </div>
  <div class="field">
    <label for="crear-categoria">Categoría</label>
    <div class="categoria-field row">
      <select id="crear-categoria" name="categoriaSeleccion">
        <option value="">Selecciona...</option>
        <option value="Materias Primas">Materias Primas</option>
        <option value="Bloques de Construcción">Bloques de Construcción</option>
        <option value="Utilidad">Utilidad</option>
        <option value="Herramientas">Herramientas</option>
        <option value="otra">Otra...</option>
      </select>
      <input name="categoriaOtra" placeholder="Nombre de la categoría nueva" aria-label="Nombre de la categoría nueva">
    </div>
  </div>
  <label class="check-label"><input type="checkbox" name="esMateriaPrima" value="true"> Es materia prima</label>
  <div class="field">
    <label for="crear-textura">Buscar textura / Palabra clave</label>
    <div class="icon-search-row">
      <input id="crear-textura" type="text" placeholder="ej. espada, pico, madera, tierra" autocomplete="off">
      <button type="button" class="btn btn-secondary icon-buscar-btn" data-buscar="crear-textura" data-fullid="crear-fullId" data-target="crear-sugerencias">Sugerir icono</button>
    </div>
    <div class="icon-suggestions" id="crear-sugerencias"></div>
  </div>
  <div class="field">
    <label for="crear-fullId">Full ID (Minecraft)</label>
    <div class="icon-preview-row">
      <div class="icon-preview" id="crear-preview">
        <img class="icon-preview-img" alt="" hidden>
        <span class="icon-preview-text">Sin icono</span>
      </div>
      <input id="crear-fullId" name="fullId" data-preview="crear-preview" placeholder="minecraft:diamond_sword" required>
    </div>
  </div>
  <div class="field">
    <label for="crear-tipo-receta">Tipo de receta</label>
    <select id="crear-tipo-receta" name="tipoReceta" class="recipe-type-select">
      <option value="CRAFTEO">Mesa de crafteo</option>
      <option value="HORNO">Horno (fundición)</option>
    </select>
  </div>
  <div>
    <span class="recipe-grid-hint">Receta (grilla 3x3 — arrastra un item desde la lista):</span>
    <span class="furnace-hint" hidden>Ítem de entrada del horno (arrastra un item desde la lista):</span>
    <div class="recipe-editor">
      <div class="recipe-grid">
        <div class="recipe-slot" th:each="i : ${#numbers.sequence(1, 9)}">
          <button type="button" class="recipe-slot-remove" title="Quitar" aria-label="Quitar item de la casilla">×</button>
          <img class="recipe-slot-icon" alt="">
          <span class="recipe-slot-name"></span>
          <input type="hidden" name="slot" value="">
        </div>
      </div>
      <div class="furnace-slot" hidden>
        <div class="recipe-slot">
          <button type="button" class="recipe-slot-remove" title="Quitar" aria-label="Quitar item de la casilla">×</button>
          <img class="recipe-slot-icon" alt="">
          <span class="recipe-slot-name"></span>
          <input type="hidden" name="entradaHorno" value="">
        </div>
        <span class="furnace-arrow" aria-hidden="true">🔥 →</span>
      </div>
      <div class="recipe-item-list"><p class="recipe-item-list-hint">Cargando items...</p></div>
    </div>
  </div>
  <div class="actions">
    <button type="submit" class="btn btn-primary">Crear</button>
  </div>
</form>
</div>
</main>

<script src="/item-icon-suggest.js"></script>
<script src="/category-select.js"></script>
<script src="/recipe-item-list.js"></script>
<script src="/recipe-type.js"></script>
<script src="/items-search.js"></script>
<div th:replace="~{fragments/toast :: toast}"></div>
</body>
</html>
