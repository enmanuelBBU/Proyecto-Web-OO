<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${'Editar ' + proyecto.nombre + ' · Proyectos'})}"></head>
<body>
<header th:replace="~{fragments/nav :: nav(activo='proyectos')}"></header>

<main class="page">
<header class="page-header">
  <div>
    <h1 class="page-title">Editar proyecto</h1>
    <p class="page-sub" th:text="${proyecto.nombre}">Nombre del proyecto</p>
  </div>
  <div class="actions">
    <a th:href="@{/proyectos/{id}(id=${proyecto.id})}" class="btn btn-secondary">Volver</a>
  </div>
</header>

<div class="card">
  <h2 class="section-title">Modificar datos del proyecto</h2>
  <p class="alert-error" th:if="${error}" th:text="${error}" role="alert"></p>

  <form method="post" th:action="@{/proyectos/{id}/update(id=${proyecto.id})}" class="stack">
    <div class="form-grid">
      <div class="field">
        <label for="edit-proyecto-nombre">Nombre del proyecto</label>
        <input id="edit-proyecto-nombre" name="nombre" th:value="${proyecto.nombre}" required>
      </div>

      <div class="field">
        <label for="edit-proyecto-estado">Estado</label>
        <select id="edit-proyecto-estado" name="estado">
          <option th:each="est : ${estados}"
                  th:value="${est}"
                  th:text="${est}"
                  th:selected="${est == proyecto.estado}">
          </option>
        </select>
      </div>
    </div>

    <div class="field">
      <label for="edit-proyecto-descripcion">Descripción</label>
      <textarea id="edit-proyecto-descripcion" name="descripcion" rows="3"
                th:text="${proyecto.descripcion}"></textarea>
    </div>

    <div th:replace="~{fragments/ubicacion :: campos(${proyecto})}"></div>

    <div class="field">
      <label>Ítems requeridos para el proyecto</label>
      <div id="proyecto-items-container" class="proyecto-items-editor">
        <div class="proyecto-item-row-edit" th:each="ir : ${proyecto.itemsRequeridos}">
          <select name="itemId" required class="proyecto-item-select" aria-label="Ítem">
            <option value="">Selecciona ítem...</option>
            <option th:each="it : ${catalogItems}"
                    th:value="${it.id}"
                    th:text="${it.nombre + ' (' + it.id + ')'}"
                    th:selected="${it.id == ir.itemId}">
            </option>
          </select>
          <input type="number" name="cantidad" min="1" th:value="${ir.cantidad}" class="proyecto-item-qty" placeholder="Cant." aria-label="Cantidad" required>
          <button type="button" class="btn btn-danger btn-remove-item" title="Quitar item" aria-label="Quitar item">&times;</button>
        </div>
      </div>
      <div><button type="button" id="btn-add-item" class="btn btn-ghost"><svg th:replace="~{fragments/icons :: icon('plus')}"></svg> Agregar ítem</button></div>
    </div>

    <div class="actions">
      <a th:href="@{/proyectos/{id}(id=${proyecto.id})}" class="btn btn-secondary">Cancelar</a>
      <button type="submit" class="btn btn-primary">Guardar cambios</button>
    </div>
  </form>
</div>
</main>

<!-- Template for adding dynamic item rows -->
<template id="proyecto-item-template">
  <div class="proyecto-item-row-edit">
    <select name="itemId" required class="proyecto-item-select" aria-label="Ítem">
      <option value="">Selecciona ítem...</option>
      <option th:each="it : ${catalogItems}" th:value="${it.id}" th:text="${it.nombre + ' (' + it.id + ')'}"></option>
    </select>
    <input type="number" name="cantidad" min="1" value="1" class="proyecto-item-qty" placeholder="Cant." aria-label="Cantidad" required>
    <button type="button" class="btn btn-danger btn-remove-item" title="Quitar item" aria-label="Quitar item">&times;</button>
  </div>
</template>

<script src="/proyecto-items.js"></script>
<div th:replace="~{fragments/toast :: toast}"></div>
</body>
</html>
