<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${mundo.nombre + ' · Mundos'})}"></head>
<body>
<header th:replace="~{fragments/nav :: nav(activo='mundos')}"></header>

<main class="page">
<header class="page-header">
  <div>
    <h1 class="page-title" th:text="${mundo.nombre}">Nombre</h1>
    <p class="page-sub">Detalle del mundo</p>
  </div>
  <div class="actions">
    <a class="btn btn-ghost" href="/mundos">Volver</a>
    <a class="btn btn-secondary" th:href="@{/mundos/{id}/edit(id=${mundo.id})}">Editar</a>
    <form method="post" th:action="@{/mundos/{id}/delete(id=${mundo.id})}"
          onsubmit="return confirm('¿Eliminar este mundo?');">
      <button class="btn btn-danger">Eliminar</button>
    </form>
  </div>
</header>

<div class="card">
  <dl class="meta-grid">
    <div><dt>Versión</dt><dd class="mono" th:text="${mundo.version}"></dd></div>
    <div><dt>Modo de juego</dt><dd><span class="badge badge-pendiente" th:text="${mundo.modoJuego}"></span></dd></div>
    <div><dt>Semilla</dt><dd class="mono" th:text="${mundo.semilla != null ? mundo.semilla : '—'}"></dd></div>
    <div th:if="${mundo.fechaCreacion != null}"><dt>Registrado</dt><dd class="mono" th:text="${mundo.fechaCreacion}"></dd></div>
  </dl>
</div>

<div class="card">
  <h2 class="section-title">Proyectos en este mundo</h2>
  <div class="empty-state" th:if="${#lists.isEmpty(proyectos)}">
    <svg th:replace="~{fragments/icons :: icon('hammer')}"></svg>
    <p>Todavía no hay proyectos asignados a este mundo.</p>
  </div>
  <div class="table-wrap" th:unless="${#lists.isEmpty(proyectos)}">
  <table>
    <thead><tr><th>Proyecto</th><th>Estado</th><th class="num">X</th><th class="num">Y</th><th class="num">Z</th></tr></thead>
    <tbody>
    <tr th:each="p : ${proyectos}">
      <td><a th:href="@{/proyectos/{id}(id=${p.id})}" th:text="${p.nombre}"></a></td>
      <td><span th:replace="~{fragments/badge :: estado(${p.estado})}"></span></td>
      <td class="num" th:text="${p.x != null ? p.x : '—'}"></td>
      <td class="num" th:text="${p.y != null ? p.y : '—'}"></td>
      <td class="num" th:text="${p.z != null ? p.z : '—'}"></td>
    </tr>
    </tbody>
  </table>
  </div>
</div>
</main>
<div th:replace="~{fragments/toast :: toast}"></div>
</body>
</html>
