<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro · SGI Minecraft</title>
<link rel="stylesheet" href="/style.css">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700&family=Karla:wght@400;700&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="auth-shell">
  <div class="auth-brand">
    <div>
      <div class="crest">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 3h12l3 5-9 13L3 8Z"/>
          <path d="M3 8h18M8 3l1.5 5L12 21l1.5-13L16 3"/>
        </svg>
        <h1>SGI Minecraft</h1>
      </div>
      <p class="tagline">Crea tu cuenta y empieza a llevar el inventario de tu proyecto.</p>
    </div>
    <ul class="stock" style="flex-direction:column; gap:6px; list-style:none; padding:0; margin:0;">
      <li>Registro con email y contraseña</li>
      <li>Perfil propio editable</li>
      <li>Ítems privados por cuenta</li>
    </ul>
  </div>

  <div class="auth-form-panel">
    <h2>Crear cuenta</h2>
    <p class="sub">Mínimo 6 caracteres para la contraseña.</p>
    <p class="error" th:if="${error}" th:text="${error}" role="alert"></p>

    <form method="post" action="/register" id="register-form" autocomplete="on">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" name="password" autocomplete="new-password" minlength="6" required>
      </div>
      <button type="submit" id="register-submit">Crear cuenta</button>
    </form>

    <p class="auth-switch">¿Ya tienes cuenta? <a href="/login">Inicia sesión</a></p>
  </div>
</div>

<script>
  document.getElementById('register-form').addEventListener('submit', function () {
    var btn = document.getElementById('register-submit');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner" aria-hidden="true"></span>Creando…';
  });
</script>
<div th:replace="~{fragments/toast :: toast}"></div>
</body>
</html>
