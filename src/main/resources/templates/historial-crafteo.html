<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Historial de crafteo')}"></head>
<body>
<header th:replace="~{fragments/nav :: nav(activo='historial')}"></header>

<main class="page">
<header class="page-header">
  <div>
    <h1 class="page-title">Historial de crafteo</h1>
    <p class="page-sub">Ítems crafteados o fundidos y los materiales consumidos.</p>
  </div>
</header>

<div class="card empty-state" th:if="${#lists.isEmpty(registros)}">
  <svg th:replace="~{fragments/icons :: icon('history')}"></svg>
  <h2 class="section-title">Todavía no has crafteado nada</h2>
  <p>Cada vez que craftees o fundas un ítem desde la <a href="/calculadora">calculadora</a>, quedará registrado aquí con los materiales que consumiste.</p>
</div>

<div class="table-wrap" th:unless="${#lists.isEmpty(registros)}">
<table>
  <thead><tr><th>Fecha</th><th>Ítem</th><th>Tipo</th><th class="num">Cantidad</th><th>Materiales consumidos</th></tr></thead>
  <tbody>
  <tr th:each="r : ${registros}">
    <td class="mono" th:text="${r.fecha != null ? #strings.replace(#strings.substring(r.fecha, 0, 16), 'T', ' ') : '—'}"></td>
    <td>
      <img th:if="${itemMap[r.itemId] != null and itemMap[r.itemId].fullId != null}"
           th:src="${'https://blocksitems.com/api/v1/items/' + itemMap[r.itemId].fullId + '/icon?size=32'}"
           width="24" height="24" alt="" class="thumb" onerror="this.style.display='none'">
      <span th:text="${r.itemNombre}"></span>
    </td>
    <td>
      <span th:class="${r.tipoReceta == 'HORNO'} ? 'badge badge-horno' : 'badge badge-pendiente'"
            th:text="${r.tipoReceta == 'HORNO'} ? 'Horno' : 'Crafteo'"></span>
    </td>
    <td class="num" th:text="${r.cantidad}"></td>
    <td>
      <span th:each="mc, st : ${r.materiales}"
            th:text="${mc.cantidad + '× ' + mc.nombre + (st.last ? '' : ', ')}"></span>
    </td>
  </tr>
  </tbody>
</table>
</div>
</main>
<div th:replace="~{fragments/toast :: toast}"></div>
</body>
</html>
